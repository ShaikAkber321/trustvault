{% extends 'base.html' %}{% block title %}Edit · TrustVault{% endblock %}{% block content %}<div class="narrow"><a class="back" href="{{ url_for('documents.detail', document_id=document.id) }}">← Back to document</a><p class="eyebrow">DOCUMENT METADATA</p><h1>Edit details</h1><form class="panel form-stack" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title<input name="title" required maxlength="180" value="{{ document.title }}"></label><label>Category<select name="category">{% for c in categories %}<option value="{{ c }}" {% if document.category == c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label><label>Description<textarea name="description" maxlength="1000" rows="4">{{ document.description }}</textarea></label><button class="primary" type="submit">Save changes</button></form></div>{% endblock %}
